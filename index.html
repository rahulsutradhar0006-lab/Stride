<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef6ff">
  <meta name="description" content="Stride: track your hours, projects and goals.">
  <title>Stride – Progress Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Shared colour gradients used by the progress rings and charts -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7DA0CA"/>
        <stop offset=".5" stop-color="#5483B3"/>
        <stop offset="1" stop-color="#052659"/>
      </linearGradient>
      <linearGradient id="gIce" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".5" stop-color="#C1E8FF"/>
        <stop offset="1" stop-color="#7DA0CA"/>
      </linearGradient>
      <linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5483B3"/>
        <stop offset="1" stop-color="#052659"/>
      </linearGradient>
    </defs>
  </svg>

  <div id="app"></div>
  <div id="overlay"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
